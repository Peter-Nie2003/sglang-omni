# SPDX-License-Identifier: Apache-2.0
#
# Qwen3-Omni speech pipeline, no process replicas, talker_ar and code2wav
# paired on one GPU.
#
# Layout (2 GPUs):
#   GPU 0: image_encoder + audio_encoder + mm_aggregate + thinker
#   GPU 1: talker_ar + code2wav
#
# The pipeline default puts code2wav on the *thinker* GPU, not the talker GPU
# (see `_speech_stages` in models/qwen3_omni/config.py), so this arm has to
# move it explicitly. `num_replicas: 1` with `replica_devices` relocates a
# process's GPU stages without producing replica bindings, which keeps this
# arm declared the same way as the replicated arm it is compared against.
#
# Serve:
#   sgl-omni serve --config examples/configs/qwen3_omni_speech_pair2gpu.yaml --port 8091
#
# A/B counterparts:
#   qwen3_omni_speech_split3gpu.yaml   same stages, code2wav on its own GPU
#   qwen3_omni_speech_replica2.yaml    two talker_ar + code2wav replicas

config_cls: Qwen3OmniSpeechPipelineConfig
name: qwen3-omni-speech-pair2gpu
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct

processes:
  talker_ar:
    num_replicas: 1
    replica_devices: [1]

  code2wav:
    num_replicas: 1
    replica_devices: [1]
