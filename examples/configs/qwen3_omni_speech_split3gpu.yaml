# SPDX-License-Identifier: Apache-2.0
#
# Qwen3-Omni speech pipeline, no process replicas, every generation stage on
# its own GPU.
#
# Layout (3 GPUs):
#   GPU 0: image_encoder + audio_encoder + mm_aggregate + thinker
#   GPU 1: talker_ar
#   GPU 2: code2wav
#
# This is the "spread without replication" control: it uses the same three
# GPUs as qwen3_omni_speech_replica2.yaml but runs one instance of each
# process, so a delta against it isolates the effect of replication from the
# effect of simply having a third GPU.
#
# Serve:
#   sgl-omni serve --config examples/configs/qwen3_omni_speech_split3gpu.yaml --port 8091

config_cls: Qwen3OmniSpeechPipelineConfig
name: qwen3-omni-speech-split3gpu
model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct

processes:
  talker_ar:
    num_replicas: 1
    replica_devices: [1]

  code2wav:
    num_replicas: 1
    replica_devices: [2]
